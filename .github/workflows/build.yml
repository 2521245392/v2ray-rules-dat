name: Build minimal geosite.dat

on:
  workflow_dispatch:
  schedule:
    # 22:00 UTC = 06:00 Asia/Shanghai on the next day
    - cron: "0 22 * * *"
  push:
    branches: [master, main]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: tools/verify/go.sum

      - name: Build and verify
        run: python build.py

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: minimal-geosite
          path: dist/*
          if-no-files-found: error

      - name: Set release metadata
        run: |
          echo "TAG_NAME=build-$(date -u +%Y%m%d-%H%M)-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "RELEASE_NAME=Minimal geosite.dat $(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          generate_release_notes: false
          files: dist/*
